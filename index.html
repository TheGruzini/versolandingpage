<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verso · The new standard for traders</title>
<meta name="description" content="Verso is the trading journal and workspace for everyone in the capital markets.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
:root{--black:#080D12;--graphite:#141A20;--raised:#1C242C;--border:#35424E;--silver:#B8C8D5;--ice:#F3F6FA;--muted:#8C9BA8;--steel:#8EAED1;--brand:#8EAED1;--line:rgba(184,200,213,.16);--up:#7FB69A;--down:#E57373;
 --sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--nav:68px}
html[lang=he]{--sans:'Heebo',system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--ice);font-family:var(--sans);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
p,h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--steel);outline-offset:4px;border-radius:8px}
.w{max-width:1240px;margin-inline:auto;padding-inline:32px}
.num{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.h1,.h2{font-weight:700;letter-spacing:-.045em;line-height:.98;text-wrap:balance}
html[lang=he] .h1,html[lang=he] .h2{font-weight:800;letter-spacing:-.025em;line-height:1.04}
.h1{font-size:clamp(52px,7.4vw,118px)}
.h2{font-size:clamp(42px,6vw,96px)}
.kick{display:block;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin-bottom:22px}
html[lang=he] .kick{letter-spacing:.04em}
.light .kick{color:#4F6C8F}
.lead{font-size:clamp(19px,1.7vw,24px);line-height:1.45;color:var(--silver);max-width:30ch;text-wrap:pretty}
.light .lead{color:#35424E}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding-inline:32px;border-radius:999px;font-size:17px;font-weight:600;white-space:nowrap;transition:transform .25s,background .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:var(--ice);color:var(--black)}.btn.solid:hover{background:#fff;box-shadow:0 10px 40px rgba(142,174,209,.35)}
.btn.line{border:1.5px solid rgba(243,246,250,.4)}.btn.line:hover{border-color:var(--ice)}
.light .btn.solid{background:var(--black);color:var(--ice)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .btn .arr{transform:scaleX(-1)}
.btn.big{height:68px;padding-inline:52px;font-size:19px}
.btn.sm{height:42px;padding-inline:22px;font-size:15px}
.dark{background:var(--black);color:var(--ice)}
.light{background:var(--ice);color:var(--black)}
section{position:relative;overflow:hidden}
/* nav */
.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:var(--steel);transform:scaleX(0);transform-origin:left;pointer-events:none}
[dir=rtl] .prog{transform-origin:right}
.nav{position:fixed;inset:0 0 auto 0;z-index:60;height:var(--nav);display:flex;align-items:center;background:rgba(8,13,18,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav .w{display:flex;align-items:center;gap:22px;width:100%;max-width:none;padding-inline:36px}
.brand{display:flex;align-items:center;gap:13px}.brand .vm{width:30px;height:auto}.brand .wm{height:12px;width:auto}
.nav .sp{flex:1}.nav .lk{font-size:15px;font-weight:500;color:var(--silver)}.nav .lk:hover{color:var(--ice)}
.lang{height:38px;padding-inline:12px;font-size:14px;color:var(--silver);border-radius:999px}.lang:hover{color:var(--ice)}
/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:calc(var(--nav) + 40px) 0 70px}
.hero .bgv{position:absolute;width:min(1100px,130vw);aspect-ratio:560/408;right:-18%;top:50%;transform:translateY(-50%);opacity:.07;pointer-events:none}
html[dir=rtl] .hero .bgv{right:auto;left:-18%}
.hero .glow{position:absolute;width:1000px;height:1000px;right:-6%;top:50%;transform:translateY(-50%);background:radial-gradient(closest-side,rgba(142,174,209,.24),rgba(142,174,209,.05) 60%,transparent);pointer-events:none}
html[dir=rtl] .hero .glow{right:auto;left:-6%}
.hero .w{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:40px;width:100%}
.hero .copy{position:relative;z-index:4}
.hero .lead{margin-top:30px}
.hero .ctas{margin-top:40px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero .note{margin-top:20px;font-size:15px;color:var(--muted)}
.hero .stage{position:relative;display:flex;justify-content:center;min-height:640px;align-items:center}
.pw{--s:1;position:relative;width:calc(292px*var(--s));height:calc(604px*var(--s))}
.pw .phone{transform:scale(var(--s));transform-origin:top left}
[dir=rtl] .pw .phone{transform-origin:top right}
.scrs{position:relative;height:100%;border-radius:38px;overflow:hidden}
.scrs .scr{position:absolute;inset:0;opacity:1}
.hero .pw{--s:1.1}
.chipf{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(20,26,32,.82);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.5);font-size:14px;direction:ltr;text-align:left;animation:fl 6s ease-in-out infinite}
.chipf img{width:34px;height:34px;border-radius:50%}
.chipf b{display:block;font:600 15px var(--mono)}.chipf small{display:block;color:var(--muted);font-size:12px}
.chipf .lch.u{color:var(--up)}.chipf .lch.d{color:var(--down)}
.chipf.c1{left:-4%;top:22%}.chipf.c2{right:-2%;bottom:20%;animation-delay:-3s}
html[dir=rtl] .chipf.c1{left:auto;right:-4%}html[dir=rtl] .chipf.c2{right:auto;left:-2%}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.chipf{animation:none}}
/* pipeline */
.pipe{padding:18vh 0}
.pipe .w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8vw;align-items:center}
.pipe .lead{margin-top:28px}
.stg{margin-top:56px;display:grid;gap:4px}
.stg span{font-size:clamp(44px,6.4vw,100px);font-weight:700;letter-spacing:-.045em;line-height:1.02;color:rgba(8,13,18,.14);transition:color .5s;direction:ltr;text-align:start}
[dir=rtl] .stg span{text-align:right;font-weight:800}
.stg span.on{color:var(--black)}
.light .phone{box-shadow:0 50px 90px rgba(8,13,18,.28)}
.pipe .pw{--s:1.08}
/* noticed */
.notice{padding:18vh 0}
.notice .h2{max-width:11ch}
.cards{margin-top:80px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cd{position:relative;height:640px;border-radius:36px;background:linear-gradient(180deg,#1C242C,#10161C);border:1px solid var(--line);overflow:hidden;padding:36px 34px;transition:transform .5s,border-color .4s}
.cd:hover{transform:translateY(-8px);border-color:rgba(184,200,213,.4)}
.cd h3{font-size:clamp(28px,2.6vw,38px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
html[lang=he] .cd h3{font-weight:800;letter-spacing:-.02em}
.cd p{margin-top:14px;color:var(--silver);font-size:18px;max-width:22ch}
.cd .pw{--s:.86;position:absolute;left:50%;bottom:-60px;margin-left:calc(-146px*var(--s))}
.cd .pw .phone{box-shadow:0 -20px 60px rgba(0,0,0,.4)}
/* team */
.team{padding:18vh 0}
.team .w{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:8vw;align-items:center}
.team .lead{margin-top:28px}
.desk{border-radius:32px;background:#fff;border:1px solid rgba(8,13,18,.08);box-shadow:0 50px 100px rgba(8,13,18,.14);padding:12px}
.desk .mr{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:22px}
.desk .mr+.mr{border-top:1px solid rgba(8,13,18,.06)}
.desk .av{width:46px;height:46px;border-radius:50%;background:var(--black);display:grid;place-items:center;flex:none}
.desk .av img{width:22px;height:auto}
.desk .mr b{font-size:19px;font-weight:600}
.desk .rl{margin-inline-start:auto;font-size:14px;font-weight:600;padding:7px 16px;border-radius:999px;background:#E6ECF2;color:#35424E}
.desk .rl.ed{background:var(--black);color:var(--ice)}
.desk .rl.sw{animation:rolesw 5s infinite}
@keyframes rolesw{0%,40%{background:#E6ECF2;color:#35424E}50%,90%{background:var(--black);color:var(--ice)}100%{background:#E6ECF2;color:#35424E}}
.desk .inv{margin:12px 10px 8px;height:54px;border-radius:999px;border:1.5px dashed rgba(8,13,18,.22);display:flex;align-items:center;justify-content:center;font-weight:600;color:#35424E;gap:8px}
/* proof */
.proof{padding:18vh 0;text-align:center}
.proof .h2{max-width:12ch;margin-inline:auto}
.stats{margin:90px auto 0;max-width:1000px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.stats b{display:block;font-size:clamp(76px,10vw,150px);font-weight:700;letter-spacing:-.06em;line-height:1;direction:ltr}
.stats>div>span{display:block;margin-top:10px;color:var(--silver);font-size:18px}
.quote{margin:110px auto 0;max-width:860px}
.quote blockquote{margin:0;font-size:clamp(24px,2.6vw,38px);font-weight:600;letter-spacing:-.025em;line-height:1.28;text-wrap:balance}
.quote figcaption{margin-top:26px;color:var(--muted);font-size:15px}
/* pricing */
.price{padding:18vh 0;text-align:center}
.price .h2{margin-inline:auto}.price .lead{margin:24px auto 0}
.tiers{margin:80px auto 0;max-width:1060px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;text-align:start}
.tr{border-radius:32px;padding:38px 34px 40px;background:#fff;border:1px solid rgba(8,13,18,.08);min-height:340px;display:flex;flex-direction:column}
.tr.top{background:var(--black);color:var(--ice);box-shadow:0 40px 90px rgba(8,13,18,.3)}
.tr small{font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#4F6C8F}
.tr.top small{color:var(--steel)}
html[lang=he] .tr small{letter-spacing:.04em}
.tr h3{margin-top:18px;font-size:60px;font-weight:700;letter-spacing:-.05em;line-height:1;direction:ltr;text-align:start}
[dir=rtl] .tr h3{text-align:right}
.tr h3 i{font-style:normal;font-size:16px;font-weight:500;letter-spacing:0;color:#6C7C8B;margin-inline-start:8px}
.tr.top h3 i{color:var(--muted)}
.tr p{margin-top:auto;padding-top:30px;font-size:18px;color:#35424E}.tr.top p{color:var(--silver)}
/* final */
.final{padding:22vh 0 16vh;text-align:center}
.final .glow{position:absolute;left:50%;top:40%;width:1100px;height:1100px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(142,174,209,.22),transparent);pointer-events:none}
.final .w{position:relative}
.final .vm{width:min(190px,40vw);margin:0 auto 46px}
.final .h1{max-width:12ch;margin-inline:auto}
.final .lead{margin:28px auto 0;max-width:none}
.final .ctas{margin-top:48px;display:flex;justify-content:center}
footer{background:var(--black);border-top:1px solid var(--line);padding:40px 0 48px}
footer .w{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:center}
footer img{height:40px;width:auto;opacity:.9}footer p{font-size:13px;color:var(--muted);max-width:70ch;line-height:1.6}
.js .rv:not(.rvd){opacity:0;transform:translateY(34px)}
@media (max-width:980px){
 .w{padding-inline:22px}
 .hero{padding-top:calc(var(--nav) + 24px)}
 .hero .w{grid-template-columns:1fr;gap:10px;text-align:center}
 .hero .lead{margin-inline:auto}.hero .ctas{justify-content:center}
 .hero .stage{min-height:560px}.hero .pw{--s:.86}
 .chipf.c1{left:0}.chipf.c2{right:0}html[dir=rtl] .chipf.c1{right:0}html[dir=rtl] .chipf.c2{left:0}
 .pipe .w,.team .w{grid-template-columns:1fr;gap:56px}.pipe .pw{margin-inline:auto;--s:.95}
 .cards,.tiers,.stats{grid-template-columns:1fr}.cd{height:580px}
 .nav .lk{display:none}.brand .wm{display:none}
}
@media (max-width:520px){.nav .btn{display:none}.lang{margin-inline-start:auto}.nav .sp{display:none}.chipf{transform:scale(.88)}.hero .stage{min-height:520px}}

/* hero: original-colour V + light */
.hero .stage .beams{position:absolute;left:50%;top:44%;width:980px;height:980px;transform:translate(-50%,-50%);background:conic-gradient(from 180deg,transparent 0 8%,rgba(142,174,209,.32) 12%,transparent 18%,transparent 36%,rgba(184,200,213,.22) 40%,transparent 47%,transparent 62%,rgba(142,174,209,.26) 66%,transparent 73%,transparent 88%,rgba(184,200,213,.18) 92%,transparent 98%);-webkit-mask:radial-gradient(closest-side,#000 18%,transparent 70%);mask:radial-gradient(closest-side,#000 18%,transparent 70%);filter:blur(10px);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hero .vwrap{position:absolute;left:50%;top:6%;width:min(900px,190%);aspect-ratio:560/408;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 0 60px rgba(142,174,209,.45))}
.hero .vwrap img{width:100%;height:100%;object-fit:contain}
.hero .vsheen{position:absolute;inset:0;-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) -150% 0/250% 100% no-repeat;animation:sheen 6.5s ease-in-out 1.4s infinite}
@keyframes sheen{0%{background-position:-150% 0}35%,100%{background-position:150% 0}}
.hero .floor{position:absolute;left:50%;bottom:2%;width:78%;height:70px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(142,174,209,.55),transparent);filter:blur(10px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.hero .vsheen{animation:none;display:none}.hero .beams{animation:none}}
.hero .pw{z-index:2}.chipf{z-index:3}
/* white cards */
.cd{background:linear-gradient(180deg,#FFFFFF,#E7EDF4);border:0;color:var(--black);box-shadow:0 30px 70px rgba(0,0,0,.35)}
.cd:hover{border-color:transparent;box-shadow:0 40px 90px rgba(142,174,209,.28)}
.cd p{color:#35424E}
.cd .pw .phone{box-shadow:0 -10px 50px rgba(8,13,18,.28)}
/* avatars: other brands' logos */
.desk .av{background:#fff;border:1px solid rgba(8,13,18,.1);overflow:hidden}
.desk .av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
/* traction */
.proof{padding:18vh 0 16vh}
.proof .pglow{position:absolute;left:50%;top:38%;width:1200px;height:1200px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(142,174,209,.16),transparent);pointer-events:none}
.proof .pv{position:absolute;left:50%;top:6%;width:min(1100px,130vw);transform:translateX(-50%);opacity:.06;pointer-events:none}
.proof .pv img{width:100%;height:auto}
.proof .w{position:relative}
.stats{max-width:1180px;grid-template-columns:repeat(3,1fr);gap:24px}
.stats>div{border-top:1px solid var(--line);padding-top:28px}
.stats b.odo{display:flex;justify-content:center;font-size:clamp(64px,8.4vw,128px);line-height:1;--h:1.06em;direction:ltr;letter-spacing:-.05em;color:var(--ice)}
.dg{display:inline-block;height:var(--h);overflow:hidden;vertical-align:top}
.dg i{display:block;font-style:normal}
.dg u{display:block;text-decoration:none;height:var(--h);line-height:var(--h);text-align:center}
.stats .ch{height:var(--h);line-height:var(--h)}
.srcs{margin:56px auto 0;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.srcs span{padding:10px 20px;border-radius:999px;border:1px solid var(--border);color:var(--silver);font-size:16px;font-weight:500;background:rgba(20,26,32,.6)}
.quote{margin-top:90px;position:relative}
/* pricing blue */
.tr h3 .blue{background:linear-gradient(135deg,#3F72B0,#7FA6D3);-webkit-background-clip:text;background-clip:text;color:#4C7DB5;-webkit-text-fill-color:transparent}
@media (max-width:980px){.stats{grid-template-columns:1fr 1fr}.hero .vwrap{width:min(560px,130%);top:10%}}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
/* phone */
.phone{position:relative;width:292px;height:604px;border-radius:46px;padding:9px;background:linear-gradient(160deg,#2A3641,#10161C);border:1.5px solid var(--border);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 80px rgba(142,174,209,.10);direction:ltr}
.phone:before{content:'';position:absolute;top:18px;left:50%;width:84px;height:22px;border-radius:12px;background:#000;transform:translateX(-50%);z-index:3}
.scr{position:relative;height:100%;border-radius:38px;overflow:hidden;background:radial-gradient(120% 50% at 50% 0%,#141A20,#080D12 70%);padding:46px 12px 0;font-family:'Inter',sans-serif;direction:ltr;text-align:left;color:var(--ice);font-size:11px;line-height:1.35}
.scr .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.scr .hd i{width:24px;height:24px;border-radius:50%;background:#000;border:1px solid var(--border);display:grid;place-items:center}
.scr .hd b{font-size:15px;font-weight:600}
.scr .mono{font-family:'JetBrains Mono',monospace}
.scr .up{color:var(--up)} .scr .down{color:var(--down)} .scr .mu{color:var(--muted)}
.scr .seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(28,36,44,.8);border:1px solid var(--border);margin-bottom:10px}
.scr .seg span{flex:1;text-align:center;padding:5px 0;border-radius:999px;color:var(--muted);font-size:10.5px;white-space:nowrap}
.scr .seg span.on{background:var(--silver);color:var(--black);font-weight:600}
.scr .card{border-radius:18px;border:1px solid var(--border);background:linear-gradient(180deg,rgba(28,36,44,.85),rgba(14,19,24,.95));overflow:hidden}
.scr .pc{padding:10px 12px;margin-bottom:8px}
.scr .pc .r1{display:flex;align-items:center;gap:8px}
.scr .av{width:26px;height:26px;border-radius:50%;background:var(--raised);border:1px solid var(--border);display:grid;place-items:center;font:500 7.5px 'JetBrains Mono',monospace;color:var(--silver);flex:none}
.scr .pc .tk{font:500 14px 'JetBrains Mono',monospace;flex:1}
.scr .pc .r2{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.scr .pc .r2 b{font:500 17px 'JetBrains Mono',monospace}
.scr .tag{font-size:9px;color:var(--muted);letter-spacing:.8px}
.scr .bar{position:absolute;left:0;right:0;bottom:0;height:50px;background:var(--graphite);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:0 6px 4px}
.scr .bar span{width:30px;height:30px;border-radius:11px;display:grid;place-items:center}
.scr .bar span.on{background:var(--raised)}
.scr .bar svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scr .bar span.on svg{stroke:var(--brand)}
.scr .big{font:500 30px 'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1}
.scr .chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 8px;border-radius:999px;font-size:9.5px;font-weight:500;background:rgba(142,174,209,.14);color:var(--brand)}
.scr .chip i{width:5px;height:5px;border-radius:50%;background:currentColor}
.scr .b{padding:9px 12px}
.scr .b+.b{border-top:1px solid var(--raised)}
.scr .b .t{display:flex;justify-content:space-between;font-size:10.5px}
.scr .b .t em{font:normal 10px 'JetBrains Mono',monospace;color:var(--muted)}
.scr .b .t em strong{color:var(--ice);font-weight:500}
.scr .tr{position:relative;height:5px;border-radius:3px;background:var(--graphite);margin:7px 0 5px}
.scr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--brand)}
.scr .tr s{position:absolute;right:0;top:-3px;width:2px;height:11px;background:var(--ice);border-radius:1px}
.scr .b .amt{font:10px 'JetBrains Mono',monospace;color:var(--muted)}

:root{--blue:#4C8DFF;--cyan:#4FD1E8;--violet:#8B7CFF;--mint:#4ADE9A;--amber:#FFB84D}
.hero{position:relative;overflow:hidden}
.hero .glow{background:none}
.aur{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.aur i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.aur i:nth-child(1){width:560px;height:560px;background:#2F6FE0;left:48%;top:-12%}
.aur i:nth-child(2){width:480px;height:480px;background:#7B5CFF;right:-8%;top:32%;animation-delay:-6s}
.aur i:nth-child(3){width:420px;height:420px;background:#18B8D8;left:28%;bottom:-20%;animation-delay:-11s;opacity:.38}
@keyframes drift{to{transform:translate(70px,-50px) scale(1.18)}}
.spot{position:absolute;left:0;top:0;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(closest-side,rgba(95,150,255,.26),transparent);pointer-events:none;opacity:0;transition:opacity .6s}
.hero:hover .spot{opacity:1}
.hero .w{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.hero .stage{justify-content:flex-end;align-items:center}
.hero .vwrap{position:relative;left:auto;top:auto;transform:none;width:270px;flex:none;margin-inline-end:6px;align-self:flex-start;margin-top:70px;z-index:3;filter:drop-shadow(0 0 36px rgba(76,141,255,.7)) drop-shadow(0 0 90px rgba(139,124,255,.45))}
.hero .vwrap img{animation:vf 7s ease-in-out infinite}
@keyframes vf{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hero .beams{left:16%;top:30%}
html[dir=rtl] .hero .beams{left:84%}
.hero .floor{width:60%;bottom:0;background:radial-gradient(closest-side,rgba(95,150,255,.65),transparent)}
.hero .pw{z-index:2}
.chipf.c1{left:2%;top:auto;bottom:10%}
html[dir=rtl] .chipf.c1{left:auto;right:2%}
.chipf{border-color:rgba(120,170,255,.35);box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 40px rgba(76,141,255,.2)}
.hero h1 .gr,.hero .h1{background:none}
/* ticker */
.tick{position:relative;z-index:2;background:linear-gradient(90deg,#0F2D63,#2A1B6B 50%,#0A4A5E);border-block:1px solid rgba(255,255,255,.12);overflow:hidden;padding:16px 0;direction:ltr}
.tick .tk{display:flex;width:max-content;animation:mq 40s linear infinite}
.tick .ti{display:flex;align-items:center;gap:10px;padding:0 30px;font:600 16px var(--mono);white-space:nowrap;border-inline-end:1px solid rgba(255,255,255,.1)}
.tick img{width:26px;height:26px;border-radius:50%}
.tick .u{color:var(--mint)}.tick .d{color:#FF8A8A}
@keyframes mq{to{transform:translateX(-50%)}}
/* blobs */
.light,.dark{position:relative}
.light>.w,.dark>.w{position:relative;z-index:1}
.blobs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.38;animation:drift 20s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:520px;height:520px;background:#7FB0FF;right:-6%;top:8%}
.blobs i:nth-child(2){width:440px;height:440px;background:#C3B4FF;left:-8%;bottom:2%;animation-delay:-8s}
.blobs i:nth-child(3){width:320px;height:320px;background:#8FE8D0;left:40%;top:-6%;animation-delay:-13s;opacity:.3}
.dark .blobs i{opacity:.26}
.dark .blobs i:nth-child(1){background:#2F6FE0}.dark .blobs i:nth-child(2){background:#7B5CFF}.dark .blobs i:nth-child(3){background:#18B8D8}
/* pipeline stage colours */
.stg span:nth-child(1).on{color:#2F6FE0}.stg span:nth-child(2).on{color:#7B5CFF}.stg span:nth-child(3).on{color:#E08A00}.stg span:nth-child(4).on{color:#0FA877}
.stg span{transition:color .5s,transform .5s}.stg span.on{transform:translateX(8px)}[dir=rtl] .stg span.on{transform:translateX(-8px)}
.kick{color:#3E7BE0}.dark .kick{color:#7FB0FF}
/* cards */
.cd:nth-child(1){--ac:#4C8DFF}.cd:nth-child(2){--ac:#8B7CFF}.cd:nth-child(3){--ac:#18C5D8}
.cd:before{content:'';position:absolute;inset:0 0 auto 0;height:7px;background:var(--ac);z-index:2}
.cd:after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:var(--ac);filter:blur(70px);opacity:.3;right:-90px;top:-110px;pointer-events:none}
.cd h3,.cd p{position:relative;z-index:1}
.cd{transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.cd:hover{transform:translateY(-14px) rotate(-.6deg)}
/* team */
.desk{position:relative}
.desk .av{position:relative;overflow:visible;background:none;border:0;width:52px;height:52px;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}

.desk .av:after{content:'';position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--mint);border:2.5px solid #fff;animation:pls 2.4s ease-out infinite}

.desk .mr{transition:background .3s,transform .3s}
.desk .mr:hover{background:#EEF3FB;transform:translateX(6px)}[dir=rtl] .desk .mr:hover{transform:translateX(-6px)}
.desk .mr:hover .av{transform:scale(1.14) rotate(-6deg)}
.desk .rl.ed{background:#2F6FE0;color:#fff}
@keyframes rolesw{0%,40%{background:#E6ECF2;color:#35424E}50%,90%{background:#7B5CFF;color:#fff}100%{background:#E6ECF2;color:#35424E}}

function liveTick(){
  Object.entries(LQ).forEach(([t,q])=>{
    const prev=q.p;q.p=Math.max(q.pc*.9,q.p+(Math.random()-.5)*q.p*.0012);q.c=(q.p/q.pc-1)*100;
    document.querySelectorAll(`[data-px="${t}"]`).forEach(e=>{e.textContent='$'+q.p.toFixed(2);e.classList.remove('fu','fd');void e.offsetWidth;e.classList.add(q.p>=prev?'fu':'fd')});
    document.querySelectorAll(`[data-ch="${t}"]`).forEach(e=>{const ar=e.dataset.ar==='1';e.textContent=(ar?(q.c>=0?'▲ ':'▼ '):(q.c>=0?'+':'−'))+Math.abs(q.c).toFixed(2)+'%';e.className='lch '+(q.c>=0?'u':'d')});
  });

}
